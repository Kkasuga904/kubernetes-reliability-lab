apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: reliability-lab
  labels:
    app: web
spec:
  # 3 replicas: one Pod failure still leaves 2 serving; rolling-update
  # and PDB behavior stay easy to observe (quorum-like, not 1 or 10).
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1 # rollout may make at most 1 replica unavailable below desired
      maxSurge: 1       # at most 1 extra Pod -> at most 4 total during rollout
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      terminationGracePeriodSeconds: 30 # must exceed uvicorn --timeout-graceful-shutdown 25
      containers:
        - name: web
          image: reliability-lab:dev # built locally, loaded into kind via scripts/load-image.sh
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: STARTUP_DELAY_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: web-config
                  key: STARTUP_DELAY_SECONDS
          resources:
            requests:
              cpu: 100m     # HPA math base: 50% target = 50m avg; easy to reason about
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Startup gate: provides a nominal ~60s startup failure budget while
          # liveness/readiness are suppressed. Without it, a slow-starting
          # container is killed prematurely (see experiment 04).
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 12 # nominal budget: 5s * 12 = ~60s
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            successThreshold: 1
            failureThreshold: 2 # ~10s to report unready; routing propagation follows
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3 # ~30s of failures before restart
          lifecycle:
            preStop:
              # Decision: keep a short sleep to give readiness/EndpointSlice
              # changes time to propagate before the application receives
              # SIGTERM. Ordering is not guaranteed. The hook and application
              # shutdown share terminationGracePeriodSeconds (30s).
              exec:
                command: ["sh", "-c", "sleep 5"]
