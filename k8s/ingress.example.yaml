# Enable only if you install ingress-nginx and want external access.
# Kept to show where Ingress would sit; not needed for the 8 experiments.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: reliability-lab
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
