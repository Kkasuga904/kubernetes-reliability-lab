# kind config: 1 control-plane + 2 workers so that
# `kubectl drain` / PDB experiments are meaningful
# (with a single node, drain evictions cannot be demonstrated).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: reliability-lab
nodes:
  - role: control-plane
  - role: worker
    labels:
      workload: web
  - role: worker
    labels:
      workload: web
