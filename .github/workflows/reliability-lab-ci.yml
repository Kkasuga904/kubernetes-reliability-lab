name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pip install -r app/requirements.txt
      - run: python -m pytest app/test_main.py -v

  docker-build:
    runs-on: ubuntu-24.04
    needs: app-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t reliability-lab:ci .

  manifest-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install kubeconform
        run: |
          curl --fail --silent --show-error --location --output kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform.tar.gz" | sha256sum --check
          tar xzf kubeconform.tar.gz
          sudo install kubeconform /usr/local/bin/kubeconform
      - name: Validate manifests
        run: kubeconform -strict -summary k8s/namespace.yaml k8s/configmap.yaml k8s/deployment.yaml k8s/service.yaml k8s/pdb.yaml k8s/hpa.yaml

  kind-smoke:
    runs-on: ubuntu-24.04
    needs: [app-test, docker-build, manifest-lint]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create kind cluster
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          config: k8s/kind-config.yaml
          cluster_name: reliability-lab
      - run: docker build -t reliability-lab:dev .
      - run: kind load docker-image reliability-lab:dev --name reliability-lab
      - name: Install metrics-server (kind)
        run: |
          curl --fail --silent --show-error --location --output metrics-server.yaml \
            https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.1/components.yaml
          echo "3c7f57cdbee0f57fb0259a150e8f6d6cb4f29d72d1aa5dce8803151dd6d4c2a1  metrics-server.yaml" | sha256sum --check
          kubectl apply -f metrics-server.yaml
          kubectl -n kube-system patch deployment metrics-server --type=json -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          kubectl wait --for=condition=Available -n kube-system deployment/metrics-server --timeout=180s
      - run: bash scripts/deploy.sh
      - run: bash scripts/run-smoke-test.sh
